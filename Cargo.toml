[package]
name = "laris-rust"
version = "0.13.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Rust acceleration kernels for LARIS: threaded sparse co-localization numerator and fused null assembly"

[lib]
name = "_laris"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
rayon = "1.10"
ndarray = "0.16"

[profile.release]
lto = true
codegen-units = 1
