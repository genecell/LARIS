name: Build and publish wheels to PyPI

# NOTE: since v0.12.0 this project builds a Rust (PyO3/maturin) extension
# `laris._laris`. A pure-Python builder would NOT compile the Rust and would
# ship a wheel missing the extension - LARIS would still import and run, on
# the NumPy fallback, silently slower. We therefore build per Python version
# with maturin and assert the extension is present in every wheel. The
# extension is version-specific (rust-numpy does not support abi3 here), so
# the matrix runs cp310/cp311/cp312.
#
# Wheels are built for Linux (manylinux) and macOS (universal2 covers both
# Apple silicon and Intel). Anyone on a platform without a wheel installs
# from the sdist, which requires a Rust toolchain.

on:
  release:
    # `published`, not `created`: GitHub does not fire `created` for draft
    # releases, and composing a release in the web UI saves a draft first, so
    # a `created` trigger silently never fires on the normal path.
    types: [published]
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --release
            --interpreter python${{ matrix.python-version }}
            --out dist
          manylinux: ${{ matrix.os == 'ubuntu-latest' && '2014' || 'auto' }}

      # The whole point of the maturin backend is that the compiled kernels
      # ship. A wheel without the extension still works (NumPy fallback), so
      # the failure is silent - assert it here rather than discover it from a
      # user's timings.
      - name: Wheel must contain the compiled extension
        shell: bash
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              sys.exit("::error::no wheel was produced")
          for whl in wheels:
              names = zipfile.ZipFile(whl).namelist()
              ext = [n for n in names
                     if n.startswith("laris/_laris") and n.endswith((".so", ".pyd"))]
              if not ext:
                  sys.exit(f"::error::{whl} has no laris/_laris extension - "
                           "it was built without compiling the Rust")
              leaked = [n for n in names
                        if n.startswith(("target/", "docs/", "tutorials/",
                                         "analysis/", "releases/"))]
              if leaked:
                  sys.exit(f"::error::{whl} contains build/doc output: {leaked[:5]}")
              print(f"{whl}: {ext[0]}, {len(names)} entries, clean")
          EOF

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # OIDC identity for PyPI Trusted Publishing
      contents: read
    # Only publish on an actual release (not manual dispatch test runs)
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Tag must match the package version
        run: |
          BUILT=$(ls dist/*.tar.gz | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')
          TAG=${GITHUB_REF_NAME#v}
          echo "tag=$TAG built=$BUILT"
          if [ "$TAG" != "$BUILT" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match the" \
                 "built version '$BUILT'. A PyPI version cannot be re-uploaded."
            exit 1
          fi

      - name: Check metadata renders on PyPI
        run: |
          pip install twine
          twine check dist/*

      # Trusted Publishing (OIDC) -- no API token. ONE-TIME SETUP on
      # pypi.org -> laris -> Publishing -> Add a trusted publisher:
      #   owner        genecell
      #   repository   LARIS
      #   workflow     publish.yml
      #   environment  (leave blank)
      # Until that exists this step cannot authenticate; an API token in
      # secrets.PYPI_API_TOKEN can be used instead by adding
      # `with: password: ${{ secrets.PYPI_API_TOKEN }}` below.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-running a release whose version is already on PyPI becomes a
          # no-op rather than a red build. A forgotten version bump is still
          # caught by the tag-vs-version guard above.
          skip-existing: true
